name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            client/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-client-${{ hashFiles('client/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-client-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        run: bun test:cover

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: client/coverage/

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server

    env:
      NODE_ENV: test
      DB_TEST_URL: ${{ secrets.DB_TEST_URL }}
      DB_TEST_NAME: ${{ secrets.DB_TEST_NAME }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TARPIT_DOMAIN: ${{ secrets.TARPIT_DOMAIN }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_TEST_NAME }}
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            server/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-server-${{ hashFiles('server/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-server-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required CI config
        run: |
          [ -n "$DB_TEST_URL" ] || { echo "Missing secret DB_TEST_URL"; exit 1; }
          [ -n "$POSTGRES_USER" ] || { echo "Missing secret POSTGRES_USER"; exit 1; }
          [ -n "$POSTGRES_PASSWORD" ] || { echo "Missing secret POSTGRES_PASSWORD"; exit 1; }
          [ -n "$DB_TEST_NAME" ] || { echo "Missing secret DB_TEST_NAME"; exit 1; }

      - name: Apply Prisma migrations
        run: bunx prisma migrate deploy

      - name: Run tests with coverage
        run: bun run test

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: server/testcoverage/

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-unit, backend]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./client

    env:
      NODE_ENV: test
      DB_TEST_URL: ${{ secrets.DB_TEST_URL }}
      NEXT_PUBLIC_DEV_BACKEND: http://localhost:3001
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TARPIT_DOMAIN: ${{ secrets.TARPIT_DOMAIN }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_TEST_NAME }}
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache client dependencies
      - name: Cache client dependencies
        uses: actions/cache@v4
        with:
          path: |
            client/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-client-${{ hashFiles('client/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-client-

      # Cache server dependencies
      - name: Cache server dependencies
        uses: actions/cache@v4
        with:
          path: |
            server/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-server-${{ hashFiles('server/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-server-

      - name: Install client dependencies
        run: bun install --frozen-lockfile

      - name: Install server dependencies
        working-directory: ./server
        run: bun install --frozen-lockfile

      - name: Apply Prisma migrations
        working-directory: ./server
        run: bunx prisma migrate deploy

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/bun.lockb') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system dependencies (if cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run E2E tests
        run: bun test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
