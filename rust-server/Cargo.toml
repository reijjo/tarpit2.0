[package]
name = "rust-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
dotenvy = "0.15.7"
envy = "0.4.2"
owo-colors = "4.3.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "ansi"] }
sysinfo = "0.31.0"
chrono = { version = "0.4.38", features = ["serde"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "uuid", "chrono"] }
validator = { version = "0.20.0", features = ["derive"] }
regex = "1.12.3"
rand = "0.10.0"
argon2 = { version = "0.5.3", features = ["std"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }
resend-rs = "0.21.1"
urlencoding = "2.1.3"

[dev-dependencies]
axum-test = "19.1.1"
serde_json = "1.0.140"
